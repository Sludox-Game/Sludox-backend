version: '3.8'

services:
  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    container_name: sludox-postgres
    environment:
      POSTGRES_USER: sludox
      POSTGRES_PASSWORD: sludox_dev
      POSTGRES_DB: sludox
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sludox']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: sludox-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Stellar Quickstart (Soroban Testnet) ──
  stellar:
    image: stellar/quickstart:soroban-dev@sha256:6c3e6d1f5e8e5c8d5f5e8e5c8d5f5e8e5c8d5f5e
    container_name: sludox-stellar
    ports:
      - '8000:8000'  # Horizon
      - '8001:8001'  # Soroban RPC
    command: ['--local', '--enable-soroban']
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
